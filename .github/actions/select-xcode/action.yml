name: Select supported Xcode
description: >-
  Selects an exact Xcode 26.x toolchain and verifies the matching Swift
  compiler. Unsupported versions and renamed or missing app bundles fail
  closed instead of silently falling back.

inputs:
  version:
    description: Supported Xcode version (26.2, 26.5, or 26.6)
    required: true

runs:
  using: composite
  steps:
    - name: Select Xcode ${{ inputs.version }}
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$XCODE_VERSION" in
          26.2)
            EXPECTED_SWIFT_VERSION="Apple Swift version 6.2"
            ;;
          26.5)
            EXPECTED_SWIFT_VERSION="Apple Swift version 6.3"
            ;;
          26.6)
            EXPECTED_SWIFT_VERSION="Apple Swift version 6.3"
            ;;
          *)
            echo "Unsupported Xcode version: $XCODE_VERSION (expected 26.2, 26.5, or 26.6)."
            exit 1
            ;;
        esac

        DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
        if [[ ! -d "$DEVELOPER_DIR" ]]; then
          echo "Xcode $XCODE_VERSION not installed at $DEVELOPER_DIR. Available Xcode apps:"
          for app in /Applications/Xcode*.app; do
            [[ -e "$app" ]] && basename "$app"
          done
          exit 1
        fi

        sudo xcode-select -s "$DEVELOPER_DIR"

        XCODE_OUTPUT="$(xcodebuild -version)"
        SWIFT_OUTPUT="$(swift --version)"
        XCODE_VERSION_LINE="${XCODE_OUTPUT%%$'\n'*}"
        if [[ "$XCODE_VERSION_LINE" != "Xcode $XCODE_VERSION" ]]; then
          echo "Selected bundle does not report Xcode $XCODE_VERSION:"
          printf '%s\n' "$XCODE_OUTPUT"
          exit 1
        fi
        if [[ "$SWIFT_OUTPUT" != *"$EXPECTED_SWIFT_VERSION"* ]]; then
          echo "Xcode $XCODE_VERSION does not provide the expected Swift compiler ($EXPECTED_SWIFT_VERSION):"
          printf '%s\n' "$SWIFT_OUTPUT"
          exit 1
        fi

        printf '%s\n' "$XCODE_OUTPUT"
        printf '%s\n' "$SWIFT_OUTPUT"
