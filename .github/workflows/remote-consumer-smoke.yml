name: Remote Consumer Smoke

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      repository_url:
        type: string
        required: true
      branch_ref:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-consumer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-revision-consumer:
    name: Exact-SHA macro and plugin consumer
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout smoke fixture only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/select-xcode
            Tests/RemoteConsumerSmoke
            Tools
      - name: Select prebuilt-compatible Xcode 26.6
        # SwiftSyntax 603.0.2 has a matching prebuilt on Swift 6.3.3. This
        # exact-revision consumer proof should exercise that fast path instead
        # of rebuilding SwiftSyntax with the older Swift 6.3.2 toolchain.
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Confirm the revision is the published main tip
        env:
          INNODI_REPOSITORY_URL: ${{ inputs.repository_url || 'https://github.com/InnoSquadCorp/InnoDI.git' }}
          INNODI_BRANCH_REF: ${{ inputs.branch_ref || 'refs/heads/main' }}
          INNODI_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          [[ "$INNODI_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format "$INNODI_BRANCH_REF"
          python3 - "$INNODI_REPOSITORY_URL" <<'PYANCHOR'
          import sys
          sys.path.insert(0, 'Tools')
          import importlib.util
          spec = importlib.util.spec_from_file_location('consumer', 'Tools/materialize-remote-consumer.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.identity(sys.argv[1])
          PYANCHOR
          remote_main="$(git ls-remote -- "$INNODI_REPOSITORY_URL" "$INNODI_BRANCH_REF" | awk '{print $1}')"
          if [[ "$remote_main" != "$INNODI_REVISION" ]]; then
            echo "Expected remote branch $INNODI_REVISION, found ${remote_main:-<missing>}." >&2
            exit 1
          fi
      - name: Materialize a fresh remote consumer
        env:
          INNODI_REPOSITORY_URL: ${{ inputs.repository_url || 'https://github.com/InnoSquadCorp/InnoDI.git' }}
          INNODI_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/innodi-remote-consumer"
          mkdir -p "$consumer"
          identity="$(python3 Tools/materialize-remote-consumer.py \
            --output "$consumer" --repository-url "$INNODI_REPOSITORY_URL" \
            --revision "$INNODI_REVISION")"
          printf 'INNODI_CONSUMER_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          printf 'INNODI_REMOTE_CONSUMER=%s\n' "$consumer" >> "$GITHUB_ENV"
      - name: Resolve the exact remote revision
        env:
          INNODI_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          swift package --package-path "$INNODI_REMOTE_CONSUMER" resolve
          python3 - "$INNODI_REMOTE_CONSUMER/Package.resolved" "$INNODI_REVISION" <<'PY'
          import json
          from pathlib import Path
          import sys

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          revision = sys.argv[2]
          pins = [
              pin for pin in resolved.get("pins", [])
              if pin.get("identity", "").lower() == __import__("os").environ["INNODI_CONSUMER_IDENTITY"]
          ]
          if len(pins) != 1:
              raise SystemExit(f"expected one InnoDI pin, found {len(pins)}")
          actual = pins[0].get("state", {}).get("revision")
          if actual != revision:
              raise SystemExit(f"expected InnoDI revision {revision}, found {actual}")
          print(f"Resolved InnoDI at exact revision {actual}")
          PY
      - name: Verify isolated primary macro prebuilt
        env:
          INNODI_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          swift package --package-path "$INNODI_REMOTE_CONSUMER" show-dependencies --format json > "$RUNNER_TEMP/innodi-consumer-graph.json"
          benchmark_root="$(python3 - "$RUNNER_TEMP/innodi-consumer-graph.json" "$INNODI_REMOTE_CONSUMER" <<'PY'
          import json, os, pathlib, sys
          dependencies = json.loads(pathlib.Path(sys.argv[1]).read_text())['dependencies']
          matches = [d for d in dependencies if d['identity'] == os.environ['INNODI_CONSUMER_IDENTITY']]
          if len(matches) != 1:
              raise SystemExit('Missing or ambiguous exact dependency checkout')
          root = pathlib.Path(matches[0]['path']).resolve()
          if not root.is_relative_to(pathlib.Path(sys.argv[2]).resolve() / '.build/checkouts'):
              raise SystemExit('Unexpected checkout location')
          print(root)
          PY
          )"
          [[ "$(git -C "$benchmark_root" rev-parse HEAD)" == "$INNODI_REVISION" ]]
          (
            cd "$benchmark_root"
            Tools/cold-build-benchmark.sh --target consumer --bindings 100 --keep-user-cache \
              --build-log "$RUNNER_TEMP/innodi-isolated-primary.log"
          ) | tee "$RUNNER_TEMP/innodi-isolated-primary.json"
          [[ "$(jq -r '.swift_syntax_mode' "$RUNNER_TEMP/innodi-isolated-primary.json")" == 'prebuilt' ]]
      - name: Build and run macro-first and plugin consumers
        run: |
          set -euo pipefail
          swift build \
            --package-path "$INNODI_REMOTE_CONSUMER" \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
          swift run --package-path "$INNODI_REMOTE_CONSUMER" --skip-build MacroOnlyApp
          swift run --package-path "$INNODI_REMOTE_CONSUMER" --skip-build ValidatedApp
      - name: Record consumer proof
        env:
          INNODI_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          {
            echo "## Remote consumer proof"
            echo
            echo "- exact revision: \`$INNODI_REVISION\`"
            echo "- macro-only consumer: built and ran"
            echo "- DAG-plugin consumer: built and ran"
          } >> "$GITHUB_STEP_SUMMARY"
