name: Examples

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      product-key:
        description: Compile-free cancellation partition only, never build authorization
        type: string
        required: false
        default: ''
      exhaustive:
        type: boolean
        default: true
  # CI Plan owns PR/main selection; this weekly run detects example drift.
  schedule:
    # Weekly Monday 06:00 UTC catches drift between Examples and Sources
    # even when no PR touches the Examples paths directly.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sample-app:
    concurrency:
      group: scoped-job-v1-${{ github.repository }}-${{ github.workflow }}-examples.yml-sample-app-pr-${{ github.event.pull_request.number }}-base-${{ github.event.pull_request.base.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'release-validation') && 'release-validation' || 'no-release-validation' }}-${{ ((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) && inputs.product-key || 'full-package' }}-${{ ((vars.INNO_JOB_CANCELLATION == '' || vars.INNO_JOB_CANCELLATION == 'enabled') && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) && (!((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) || inputs.product-key != '')) && 'active' || format('off-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ (vars.INNO_JOB_CANCELLATION == '' || vars.INNO_JOB_CANCELLATION == 'enabled') && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) && (!((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) || inputs.product-key != '') }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify prebuilt-compatible Xcode 27 and Swift 6.4
        # SwiftSyntax 604.0.0 has a matching prebuilt on Swift 6.4, the primary
        # consumer toolchain. Keep the representative consumer lane there so
        # pull-request feedback does not pay the SwiftSyntax source-build tax.
        run: |
          set -euo pipefail
          [[ "$(xcodebuild -version)" == Xcode\ 27* ]]
          [[ "$(swift --version)" == *"Apple Swift version 6.4"* ]]
      - name: Build and Test SampleApp
        env:
          PRODUCT_SCOPE_ENABLED: ${{ (vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true') && 'true' || 'false' }}
        run: |
          python3 -B Tools/ci_product_execution.py build --kind di-example --units SampleApp --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"
          python3 -B Tools/ci_product_execution.py verify --kind di-example --units SampleApp --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"
      - name: Run SampleApp
        # Execution is part of the preceding admitted recipe; prove its exact result.
        env:
          PRODUCT_SCOPE_ENABLED: ${{ (vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true') && 'true' || 'false' }}
        run: python3 -B Tools/ci_product_execution.py verify --kind di-example --units SampleApp --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"

  swiftui-example:
    concurrency:
      group: scoped-job-v1-${{ github.repository }}-${{ github.workflow }}-examples.yml-swiftui-example-pr-${{ github.event.pull_request.number }}-base-${{ github.event.pull_request.base.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'release-validation') && 'release-validation' || 'no-release-validation' }}-${{ ((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) && inputs.product-key || 'full-package' }}-${{ ((vars.INNO_JOB_CANCELLATION == '' || vars.INNO_JOB_CANCELLATION == 'enabled') && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) && (!((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) || inputs.product-key != '')) && 'active' || format('off-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ (vars.INNO_JOB_CANCELLATION == '' || vars.INNO_JOB_CANCELLATION == 'enabled') && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) && (!((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) || inputs.product-key != '') }}
    # SampleApp is the representative PR consumer. The larger examples stay
    # exhaustive main/scheduled gates so a source edit does not trigger three
    # independent cold macro builds before review feedback is available.
    if: github.event_name != 'pull_request' || inputs.exhaustive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Build and Test SwiftUIExample
        env:
          PRODUCT_SCOPE_ENABLED: ${{ (vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true') && 'true' || 'false' }}
        run: |
          python3 -B Tools/ci_product_execution.py build --kind di-example --units SwiftUIExample --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"
          python3 -B Tools/ci_product_execution.py verify --kind di-example --units SwiftUIExample --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"

  preview-injection-example:
    concurrency:
      group: scoped-job-v1-${{ github.repository }}-${{ github.workflow }}-examples.yml-preview-injection-example-pr-${{ github.event.pull_request.number }}-base-${{ github.event.pull_request.base.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'release-validation') && 'release-validation' || 'no-release-validation' }}-${{ ((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) && inputs.product-key || 'full-package' }}-${{ ((vars.INNO_JOB_CANCELLATION == '' || vars.INNO_JOB_CANCELLATION == 'enabled') && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) && (!((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) || inputs.product-key != '')) && 'active' || format('off-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ (vars.INNO_JOB_CANCELLATION == '' || vars.INNO_JOB_CANCELLATION == 'enabled') && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) && (!((vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true')) || inputs.product-key != '') }}
    if: github.event_name != 'pull_request' || inputs.exhaustive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Build and Test PreviewInjectionExample
        env:
          PRODUCT_SCOPE_ENABLED: ${{ (vars.INNODI_PRODUCT_CI == '' || vars.INNODI_PRODUCT_CI == 'true') && 'true' || 'false' }}
        run: |
          python3 -B Tools/ci_product_execution.py build --kind di-example --units PreviewInjectionExample --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"
          python3 -B Tools/ci_product_execution.py verify --kind di-example --units PreviewInjectionExample --platform macOS --temporary "$RUNNER_TEMP/product-example" --receipts "$RUNNER_TEMP/product-example-receipts"

  examples-required:
    name: Examples Required
    if: ${{ always() }}
    needs: [sample-app, swiftui-example, preview-injection-example]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require selected example jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          EXHAUSTIVE: ${{ github.event_name != 'pull_request' || inputs.exhaustive }}
        run: |
          if [[ "$EXHAUSTIVE" == true ]]; then
            python3 Tools/ci-policy.py require --jobs sample-app swiftui-example preview-injection-example
          else
            python3 Tools/ci-policy.py require --jobs sample-app --skipped swiftui-example preview-injection-example
          fi
