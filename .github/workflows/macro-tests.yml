name: Macro Tests

on:
  pull_request:

jobs:
  macro-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 26.3
        uses: ./.github/actions/select-xcode
      - name: Run Test Suite
        # -warnings-as-errors catches any regression that would slip through
        # `swiftSettings`'s warning-only StrictConcurrency gate. Paired with
        # the main `release.yml` strict-concurrency check so every PR fails
        # on the same rules that block a tag. `--enable-code-coverage`
        # makes the next step's per-module rollup possible without a second
        # build run.
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --enable-code-coverage
      - name: Collect Code Coverage
        # Coverage is informational — surfaced in the workflow step summary
        # and uploaded as an artifact, but not a merge gate. The PR template
        # asks reviewers to scan the per-module table for unexpected drops.
        run: |
          Tools/collect-coverage.sh
          {
            echo "## Code coverage"
            echo
            cat coverage/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/report.txt
            coverage/summary.json
            coverage/summary.md
          if-no-files-found: error
      - name: No fatalError in synthesized code
        # Macro-synthesized accessors must never embed a `fatalError(...)`
        # trap into user code. The two allow-listed sites are explicit
        # opt-outs (validateDAG: false) and the Lazy/Provider deferred-cell
        # ordering invariant; both are documented in
        # `docs/internal/fatalerror-inventory.md`. A drift in either
        # allow-list pattern is a forcing function for an inventory update.
        run: Tools/check-no-fatalerror-in-macros.sh
      - name: Validate CI keeps build validation enabled
        run: Tools/check-ci-validation-opt-out.sh
      - name: Validate compiled documentation snippets
        run: Tools/check-docs-code-blocks.sh
      - name: Validate localized README structural sync
        # Strict mode: localized READMEs must match the English canonical
        # structure (swift fence count + H2 header count). Set
        # `INNODI_README_SYNC_STRICT=0` only as a temporary soft-rollout
        # window when the next major version restructures the canonical
        # README. The release gate is already strict.
        run: Tools/check-localized-readme-sync.sh
      - name: Validate Global DAG
        run: swift run InnoDI-DependencyGraph --root . --validate-dag
      - name: Report Build-Validation Escape Hatches
        # Surfaces every `@DIContainer(...validateDAG: false...)` site and
        # any active `INNODI_DISABLE_BUILD_VALIDATION` environment override
        # in the workflow's step summary. Informational; merges are not
        # gated. `INNODI_ESCAPE_HATCH_FAIL=1` would flip the script into a
        # blocker if an org wants to treat new opt-outs as release blockers.
        env:
          INNODI_ESCAPE_HATCH_JSON: build/escape-hatch-report.json
        run: |
          {
            Tools/report-validate-dag-escape-hatches.sh
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Escape Hatch Report
        uses: actions/upload-artifact@v4
        with:
          name: escape-hatch-report
          path: build/escape-hatch-report.json
          if-no-files-found: error
      - name: Report Deferred-Wrapper Alias Findings
        # Surfaces cross-file `typealias L = Lazy<T>` / `typealias P = Provider<T>`
        # that the macro's same-file canonical-identifier check cannot see.
        # Cross-file aliases silently behave as hard edges, breaking cycle escape.
        # Informational; reviewers decide whether each finding is intentional.
        run: |
          {
            swift run --quiet InnoDI-DeferredAliasScan --root . --json build/deferred-aliases.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Deferred-Wrapper Alias Report
        uses: actions/upload-artifact@v4
        with:
          name: deferred-aliases-report
          path: build/deferred-aliases.json
          if-no-files-found: error
      - name: Build Extended Examples
        run: |
          (cd Examples/SwiftUIExample && swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors && swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors)
          (cd Examples/PreviewInjectionExample && swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors && swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors)
      - name: Macro Performance Check
        run: Tools/measure-macro-performance.sh --enforce

  path-identity:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: not-innodi
      - name: Select Xcode 26.3
        uses: ./not-innodi/.github/actions/select-xcode
      - name: Run Strict Concurrency Fixture
        working-directory: not-innodi
        run: swift test --filter StrictConcurrencyBuildTests
      - name: Build Examples
        working-directory: not-innodi
        run: |
          (cd Examples/SwiftUIExample && swift build)
          (cd Examples/PreviewInjectionExample && swift build)
