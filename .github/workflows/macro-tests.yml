name: Macro Tests

on:
  pull_request:

jobs:
  macro-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 26.3
        # Pin to Xcode 26.3 (Swift 6.3). The previous fallback chain allowed
        # 26.2 (Swift 6.2.x) on the runner, which silently disabled the macro
        # performance regression gate because the baseline in
        # `Tools/macro-performance-baseline.json` is keyed to Swift 6.3. Fail
        # fast here if 26.3 is unavailable so the signal is obvious.
        run: |
          if [[ ! -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            echo "Xcode 26.3 not installed on this runner."
            for xcode in /Applications/Xcode*.app; do
              [[ -e "$xcode" ]] && echo "$(basename "$xcode")"
            done
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Run Macro Tests
        # -warnings-as-errors catches any regression that would slip through
        # `swiftSettings`'s warning-only StrictConcurrency gate. Paired with
        # the main `release.yml` strict-concurrency check so every PR fails
        # on the same rules that block a tag.
        run: swift test --filter InnoDIMacrosTests -Xswiftc -warnings-as-errors
      - name: Validate Global DAG
        run: swift run InnoDI-DependencyGraph --root . --validate-dag
      - name: Build Extended Examples
        run: |
          (cd Examples/SwiftUIExample && swift build -Xswiftc -warnings-as-errors)
          (cd Examples/PreviewInjectionExample && swift build -Xswiftc -warnings-as-errors)
      - name: Macro Performance Check (non-blocking)
        continue-on-error: true
        run: Tools/measure-macro-performance.sh --iterations 5

  path-identity:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: not-innodi
      - name: Select Xcode 26.3
        run: |
          if [[ ! -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            echo "Xcode 26.3 not installed on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Run Strict Concurrency Fixture
        working-directory: not-innodi
        run: swift test --filter StrictConcurrencyBuildTests
      - name: Build Examples
        working-directory: not-innodi
        run: |
          (cd Examples/SwiftUIExample && swift build)
          (cd Examples/PreviewInjectionExample && swift build)
