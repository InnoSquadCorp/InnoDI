name: CI
run-name: >-
  ${{ inputs.dependabot_merge_pr && format('CI / Dependabot merge #{0}', inputs.dependabot_merge_pr) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      dependabot_merge_pr:
        description: Verified actual Dependabot merge at current main (metadata-only recovery)
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: macro-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-plan:
    name: CI Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      post_merge: ${{ steps.origin.outputs.post_merge }}
      plan: ${{ steps.plan.outputs.plan }}
      policy: ${{ steps.plan.outputs.policy }}
      fast-tests: ${{ steps.plan.outputs.fast-tests }}
      macro-tests: ${{ steps.plan.outputs.macro-tests }}
      consumer-contracts: ${{ steps.plan.outputs.consumer-contracts }}
      sanitizers: ${{ steps.plan.outputs.sanitizers }}
      swift-62-compatibility: ${{ steps.plan.outputs.swift-62-compatibility }}
      xcode-27-compatibility: ${{ steps.plan.outputs.xcode-27-compatibility }}
      apple-platform-builds: ${{ steps.plan.outputs.apple-platform-builds }}
      path-identity: ${{ steps.plan.outputs.path-identity }}
      examples: ${{ steps.plan.outputs.examples }}
      documentation-contracts: ${{ steps.plan.outputs.documentation-contracts }}
      docc: ${{ steps.plan.outputs.docc }}
      remote-consumer: ${{ steps.plan.outputs.remote-consumer }}
      examples_full: ${{ steps.plan.outputs.examples_full }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual post-merge main origin
        id: origin
        if: github.event_name == 'workflow_dispatch' && inputs.dependabot_merge_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_PR: ${{ inputs.dependabot_merge_pr }}
        run: |
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_REPOSITORY" == 'InnoSquadCorp/InnoDI' ]]
          python3 -B Tools/dependabot-merge-policy.py verify-post-merge --pr "$MERGED_PR" --expected-sha "$GITHUB_SHA"
          echo 'post_merge=true' >> "$GITHUB_OUTPUT"
      - name: Classify exact event changes
        id: plan
        run: python3 Tools/ci-policy.py plan --event "$GITHUB_EVENT_PATH" --output build/ci-plan.json

  policy:
    name: CI and public operations policy
    needs: ci-plan
    # Existing Python public-API negative tests invoke swiftc. Use the same
    # exact compiler as the primary contracts instead of a runner's default.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Validate repository automation policy
        run: |
          Tools/check-ci-validation-opt-out.sh
          Tools/check-ci-action-pins.sh
          python3 -B -m unittest discover -s Tools/tests
          python3 Tools/check-public-operations.py

  documentation-contracts:
    name: Documentation contracts
    needs: ci-plan
    if: needs.ci-plan.outputs.documentation-contracts == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Validate copyable documentation and mirrors
        # check-localized-readme-sync.sh is strict: the Korean README and
        # every Korean DocC article must match the structure of their English
        # canonical page (swift fence count + H2 header count), and the frozen
        # translations must stay notice pages. Set `INNODI_README_SYNC_STRICT=0`
        # only as a temporary soft-rollout window when the next major version
        # restructures the canonical docs. The release gate is already strict.
        run: |
          Tools/check-docs-code-blocks.sh
          Tools/check-docs-local-links.sh
          Tools/check-localized-readme-sync.sh

  examples:
    needs: ci-plan
    if: needs.ci-plan.outputs.examples == 'true'
    uses: ./.github/workflows/examples.yml
    with:
      exhaustive: ${{ needs.ci-plan.outputs.examples_full == 'true' }}

  docc:
    needs: ci-plan
    if: needs.ci-plan.outputs.docc == 'true'
    uses: ./.github/workflows/docc-validation.yml
    with:
      publish_pages: ${{ needs.ci-plan.outputs.post_merge == 'true' }}

  remote-consumer:
    needs: ci-plan
    if: needs.ci-plan.outputs.remote-consumer == 'true'
    uses: ./.github/workflows/remote-consumer-smoke.yml
    with:
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
      repository_url: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/InnoSquadCorp/InnoDI.git' }}
      branch_ref: ${{ github.event.merge_group.head_ref || github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}

  fast-tests:
    name: Fast PR contracts
    needs: ci-plan
    if: needs.ci-plan.outputs.fast-tests == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Restore SwiftPM dependency cache
        # Repository mirrors and downloaded prebuilts only. Build products are
        # not cached here: a fresh checkout rebuilds every InnoDI module.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/prebuilts
          key: swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Package.resolved') }}
      - name: Run in-process test contracts
        # Consumer, strict-concurrency, one migration smoke, and the unique
        # binding fix-it consumer contracts spawn clean SwiftPM builds. The
        # fix-it build alone compiles SwiftSyntax from source with one job. They
        # remain exhaustive main gates below, the first two in consumer-contracts;
        # repeating them on every PR dominated feedback time without adding
        # local semantic coverage. All in-process unit, macro-expansion, graph,
        # runtime, migration, and release-contract tests still run here with
        # production diagnostics. Independent cases run serially so synchronous
        # process fixtures cannot starve another test's async deadline; tasks
        # and contention assertions inside each test remain concurrent.
        run: |
          set -o pipefail
          mkdir -p build
          swift test \
            --no-parallel \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors \
            --skip 'InnoDIBuildSupportTests.(ExternalConsumerContractTests|StrictConcurrencyBuildTests)' \
            --skip 'InnoDIMigrationCoreTests.InnoDIMigrationCoreTests/publicExecutableRunsFromFreshConsumer' \
            --skip 'InnoDIMacrosTests.MechanicalFixItTests/uniqueBindingRepairBuildsAndGraphs' \
            2>&1 | tee build/fast-pr-test-output.log
      - name: Summarize test suite durations
        if: ${{ always() && hashFiles('build/fast-pr-test-output.log') != '' }}
        run: |
          Tools/summarize-test-durations.py build/fast-pr-test-output.log \
            --title "Slowest test suites (fast PR lane)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate macro synthesis and CI policy
        run: |
          Tools/check-no-fatalerror-in-macros.sh
          Tools/check-ci-validation-opt-out.sh
          Tools/check-ci-action-pins.sh
      - name: Validate public API and Global DAG
        run: |
          Tools/check-public-api.py
          swift run InnoDI-DependencyGraph --root . --validate-dag
      - name: Report Build-Validation Escape Hatches
        env:
          INNODI_ESCAPE_HATCH_JSON: build/escape-hatch-report.json
        run: |
          {
            Tools/report-validate-dag-escape-hatches.sh
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Escape Hatch Report
        # release-validation PRs also run the exhaustive job. Preserve both
        # immutable reports instead of colliding with its canonical names.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: escape-hatch-report-fast-pr
          path: build/escape-hatch-report.json
          if-no-files-found: error
      - name: Report Deferred-Wrapper Alias Findings
        run: |
          {
            swift run --quiet InnoDI-DeferredAliasScan --root . --json build/deferred-aliases.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Deferred-Wrapper Alias Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deferred-aliases-report-fast-pr
          path: build/deferred-aliases.json
          if-no-files-found: error

  macro-tests:
    name: Exhaustive release contracts
    needs: ci-plan
    if: needs.ci-plan.outputs.macro-tests == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Restore SwiftPM dependency cache
        # Repository mirrors and downloaded prebuilts only. Build products are
        # not cached here: a fresh checkout rebuilds every InnoDI module.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/prebuilts
          key: swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Package.resolved') }}
      - name: Run clean coverage gate
        id: coverage
        # Shared with the release gate so both lanes measure one strict pass
        # from fresh profile data and enforce the same module floors. The
        # consumer-contracts job runs the subprocess build contracts beside it.
        run: Tools/run-coverage-gate.sh
      - name: Upload Coverage Artifacts
        if: ${{ always() && hashFiles('coverage/summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/report.txt
            coverage/summary.json
            coverage/summary.md
          if-no-files-found: error
      - name: No fatalError in synthesized code
        # Macro-synthesized accessors must never embed a `fatalError(...)`
        # trap into user code. The two allow-listed sites are explicit
        # opt-outs (validateDAG: false) and the Lazy/Provider deferred-cell
        # ordering invariant; both are documented in
        # `docs/internal/fatalerror-inventory.md`. A drift in either
        # allow-list pattern is a forcing function for an inventory update.
        run: Tools/check-no-fatalerror-in-macros.sh
      - name: Validate CI keeps build validation enabled
        run: Tools/check-ci-validation-opt-out.sh
      - name: Validate pinned CI dependencies and permissions
        run: Tools/check-ci-action-pins.sh
      - name: Validate bounded release-note extraction
        run: python3 -B -m unittest discover -s Tools/tests -p 'test_release_notes.py'
      - name: Validate public API baseline
        # Compiler-emitted symbol graphs cover macro declarations, runtime
        # wrappers, SwiftUI protocols, and public SwiftUI extensions.
        run: Tools/check-public-api.py
      - name: Validate Global DAG
        run: swift run InnoDI-DependencyGraph --root . --validate-dag
      - name: Report Build-Validation Escape Hatches
        # Surfaces every `@DIContainer(...validateDAG: false...)` site and
        # any active `INNODI_DISABLE_BUILD_VALIDATION` environment override
        # in the workflow's step summary. Informational; merges are not
        # gated. `INNODI_ESCAPE_HATCH_FAIL=1` would flip the script into a
        # blocker if an org wants to treat new opt-outs as release blockers.
        env:
          INNODI_ESCAPE_HATCH_JSON: build/escape-hatch-report.json
        run: |
          {
            Tools/report-validate-dag-escape-hatches.sh
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Escape Hatch Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: escape-hatch-report
          path: build/escape-hatch-report.json
          if-no-files-found: error
      - name: Report Deferred-Wrapper Alias Findings
        # Surfaces cross-file `typealias L = Lazy<T>` / `typealias P = Provider<T>`
        # that the macro's same-file canonical-identifier check cannot see.
        # Cross-file aliases are not recognized as deferred wrappers. Review
        # their construction/order behavior; wrappers never exempt ownership cycles.
        # Informational; reviewers decide whether each finding is intentional.
        run: |
          {
            swift run --quiet InnoDI-DeferredAliasScan --root . --json build/deferred-aliases.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Deferred-Wrapper Alias Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deferred-aliases-report
          path: build/deferred-aliases.json
          if-no-files-found: error
      - name: Macro Performance Check
        id: macro_performance
        # Pull requests, whether labeled release-validation or selected by CI
        # Plan, record the measurement without failing on hosted-runner
        # variance. Pushes to main, merge queue runs, and manual dispatch keep
        # the enforced gate, and the Release Gate enforces the pinned baseline
        # again for the exact candidate SHA.
        env:
          MACRO_PERFORMANCE_MODE: ${{ github.event_name == 'pull_request' && '--report-only' || '--enforce' }}
        run: |
          Tools/measure-macro-performance.sh \
            "$MACRO_PERFORMANCE_MODE" \
            --output build/macro-performance-report.json
      - name: Upload Macro Performance Report
        # Preserve the report when measurement itself fails, but do not turn an
        # earlier test/build failure into a second missing-artifact failure.
        if: ${{ always() && steps.macro_performance.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macro-performance-report
          path: build/macro-performance-report.json
          if-no-files-found: error
      - name: Macro Performance Trend
        if: ${{ !cancelled() && steps.macro_performance.outcome != 'skipped' }}
        # Compares the current lower envelope against the rolling median of
        # recent lower envelopes on `perf-history`. Catches gradual creep that
        # a single-baseline `--enforce` gate misses without promoting shared
        # runner scheduling noise to a product regression. The script exits 0
        # silently when perf-history is empty or unreachable, so this
        # step is safe to land before the first append happens.
        env:
          TREND_MODE: ${{ github.event_name == 'pull_request' && '--report-only' || '' }}
        run: |
          Tools/check-performance-trend.sh \
            --current-report build/macro-performance-report.json \
            ${TREND_MODE:+"$TREND_MODE"}
      # Runtime trace timings are optional diagnostics in the manual
      # runtime-trace-diagnostics.yml workflow, not a release performance gate.
      - name: Upload Performance Trend Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-trend-report
          path: build/perf-trend-report.json
          if-no-files-found: ignore

      - name: Measure Independent Macro Feature Workloads
        if: ${{ !cancelled() && steps.macro_performance.outcome != 'skipped' }}
        # Valid expansion/report contracts are enforced; durations are
        # explicitly unbaselined and never replace the composite-v2 gate.
        run: Tools/measure-macro-features.sh
      - name: Upload Macro Feature Performance Report
        if: ${{ always() && hashFiles('build/macro-feature-performance-report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macro-feature-performance-report
          path: build/macro-feature-performance-report.json
          if-no-files-found: error

  consumer-contracts:
    name: Exhaustive consumer contracts (Xcode 26.6)
    # The subprocess build contracts run beside the coverage gate instead of
    # inside it. They build fixture packages in separate, non-instrumented
    # Swift processes, so they add no InnoDI coverage, and on main they took
    # about 1,415 of the gate's 1,460 test seconds.
    needs: ci-plan
    if: needs.ci-plan.outputs.consumer-contracts == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Restore SwiftPM dependency cache
        # Repository mirrors and downloaded prebuilts only. Build products are
        # not cached here: a fresh checkout rebuilds every InnoDI module.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/prebuilts
          key: swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Package.resolved') }}
      - name: Restore external consumer build cache
        # The contracts reuse this scratch root by design. Consumer sources are
        # materialized fresh and InnoDI rebuilds from the checkout; the cache
        # keeps the SwiftSyntax products that DAG-plugin consumers compile from
        # source. Only that profile is cached (about 1.8 GB per toolchain) so
        # three toolchains stay inside the repository cache budget. Keys never
        # cross toolchains or swift-syntax pins.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/external-consumer-contracts/dag-plugin-source
          key: innodi-external-consumers-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Package.resolved') }}
      - name: Run strict external compatibility contracts
        run: |
          set -euo pipefail
          mkdir -p build
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --filter StrictConcurrencyBuildTests \
            2>&1 | tee build/consumer-contracts-output.log
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --filter ExternalConsumerContractTests \
            2>&1 | tee -a build/consumer-contracts-output.log
      - name: Summarize test suite durations
        if: ${{ always() && hashFiles('build/consumer-contracts-output.log') != '' }}
        run: |
          Tools/summarize-test-durations.py build/consumer-contracts-output.log \
            --title "Slowest test suites (consumer contracts)" >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: Thread and address sanitizers (Xcode 26.6)
    needs: ci-plan
    if: needs.ci-plan.outputs.sanitizers == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Run thread sanitizer suite
        # Fresh-consumer and mechanical fix-it build contracts launch separate
        # swift processes that do not inherit this sanitizer. They run in the
        # exhaustive/toolchain lanes; keep this job focused on code that is
        # actually instrumented.
        run: >-
          swift test
          --no-parallel
          --scratch-path .build/main-tsan
          --sanitize=thread
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          --skip 'InnoDIBuildSupportTests.(ExternalConsumerContractTests|StrictConcurrencyBuildTests)'
          --skip 'InnoDIMigrationCoreTests.InnoDIMigrationCoreTests/publicExecutableRunsFromFreshConsumer'
          --skip 'InnoDIMacrosTests.MechanicalFixItTests/uniqueBindingRepairBuildsAndGraphs'
      - name: Run address sanitizer suite
        run: >-
          swift test
          --no-parallel
          --scratch-path .build/main-asan
          --sanitize=address
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          --skip 'InnoDIBuildSupportTests.(ExternalConsumerContractTests|StrictConcurrencyBuildTests)'
          --skip 'InnoDIMigrationCoreTests.InnoDIMigrationCoreTests/publicExecutableRunsFromFreshConsumer'
          --skip 'InnoDIMacrosTests.MechanicalFixItTests/uniqueBindingRepairBuildsAndGraphs'

  swift-62-compatibility:
    name: Swift 6.2 compatibility
    needs: ci-plan
    if: needs.ci-plan.outputs.swift-62-compatibility == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.2
        uses: ./.github/actions/select-xcode
        with:
          version: "26.2"
      - name: Restore SwiftPM dependency cache
        # Repository mirrors and downloaded prebuilts only. Build products are
        # not cached here: a fresh checkout rebuilds every InnoDI module.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/prebuilts
          key: swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
      - name: Restore external consumer build cache
        # The contracts reuse this scratch root by design. Consumer sources are
        # materialized fresh and InnoDI rebuilds from the checkout; the cache
        # keeps the SwiftSyntax products that DAG-plugin consumers compile from
        # source. Only that profile is cached (about 1.8 GB per toolchain) so
        # three toolchains stay inside the repository cache budget. Keys never
        # cross toolchains or swift-syntax pins.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/external-consumer-contracts/dag-plugin-source
          key: innodi-external-consumers-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
      - name: Run strict external compatibility contracts
        run: |
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --filter StrictConcurrencyBuildTests
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --filter ExternalConsumerContractTests
      - name: Validate minimum-toolchain public API semantics
        run: |
          python3 -B -m unittest discover -s Tools/tests -p 'test_public_api*.py'
          Tools/check-public-api.py
      - name: Report compiler canaries (informational)
        # Swift 6.2 builds SwiftSyntax from source for the canary package, so
        # the known-crashing control toolchain runs it on manual dispatch only.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: Tools/run-compiler-canaries.sh

  xcode-27-compatibility:
    name: Xcode 27 compatibility preview
    needs: ci-plan
    if: needs.ci-plan.outputs.xcode-27-compatibility == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify Xcode 27 and Swift 6.4
        run: |
          set -euo pipefail
          xcode_output="$(xcodebuild -version)"
          swift_output="$(swift --version)"
          [[ "$xcode_output" == Xcode\ 27* ]]
          [[ "$swift_output" == *"Apple Swift version 6.4"* ]]
          printf '%s\n' "$xcode_output"
          printf '%s\n' "$swift_output"
      - name: Restore SwiftPM dependency cache
        # Repository mirrors and downloaded prebuilts only. Build products are
        # not cached here: a fresh checkout rebuilds every InnoDI module.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/prebuilts
          key: swiftpm-deps-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('Package.resolved') }}
      - name: Restore external consumer build cache
        # The contracts reuse this scratch root by design. Consumer sources are
        # materialized fresh and InnoDI rebuilds from the checkout; the cache
        # keeps the SwiftSyntax products that DAG-plugin consumers compile from
        # source. Only that profile is cached (about 1.8 GB per toolchain) so
        # three toolchains stay inside the repository cache budget. Keys never
        # cross toolchains or swift-syntax pins.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/external-consumer-contracts/dag-plugin-source
          key: innodi-external-consumers-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('Package.resolved') }}
      - name: Run strict external compatibility contracts
        run: |
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --filter StrictConcurrencyBuildTests
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors --filter ExternalConsumerContractTests
      - name: Validate source-authored public API baseline
        run: Tools/check-public-api.py
      - name: Report compiler canaries (informational)
        if: always()
        run: Tools/run-compiler-canaries.sh

  apple-platform-builds:
    name: Apple platform builds (Xcode 26.6)
    needs: ci-plan
    if: needs.ci-plan.outputs.apple-platform-builds == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Build public libraries for every declared Apple platform
        run: |
          set -euo pipefail
          SOURCE_PREFIX="$(pwd -P)/Sources/"
          mkdir -p .build/platform-logs
          for platform in macOS iOS watchOS tvOS visionOS; do
            echo "Building InnoDISwiftUI for generic/platform=$platform"
            BUILD_LOG=".build/platform-logs/${platform}.log"
            xcodebuild -quiet \
              -scheme InnoDISwiftUI \
              -destination "generic/platform=$platform" \
              -derivedDataPath .build/xcode-platform-derived-data \
              -clonedSourcePackagesDirPath .build/xcode-platform-source-packages \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SWIFT_STRICT_CONCURRENCY=complete \
              build 2>&1 | tee "$BUILD_LOG"
            if awk -v prefix="$SOURCE_PREFIX" '
              index($0, prefix) && index($0, "warning:") { print; found = 1 }
              END { exit(found ? 0 : 1) }
            ' "$BUILD_LOG"; then
              echo "Compiler warning emitted by an InnoDI source while building $platform."
              exit 1
            fi
          done

  path-identity:
    needs: ci-plan
    if: needs.ci-plan.outputs.path-identity == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: not-innodi
      - name: Select Xcode 26.6
        uses: ./not-innodi/.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Run representative renamed-checkout contracts
        working-directory: not-innodi
        env:
          # One fixture is sufficient here because every external-consumer
          # manifest is materialized through the same package-identity helper.
          # The complete pass/fail matrix already runs in the primary jobs.
          INNODI_EXTERNAL_FIXTURE: basic-container
        run: |
          swift test --filter StrictConcurrencyBuildTests.swiftUIMainActorRootBuildsUnderStrictConcurrency
          swift test --filter ExternalConsumerContractTests.compilePassFixturesBuild
      - name: Validate examples from the renamed checkout
        working-directory: not-innodi
        run: |
          scratch_path="$RUNNER_TEMP/innodi-path-identity-examples"
          (cd Examples/SampleApp && swift test --scratch-path "$scratch_path" -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors && swift run --scratch-path "$scratch_path" --skip-build SampleApp)
          (cd Examples/SwiftUIExample && swift build --scratch-path "$scratch_path")
          (cd Examples/PreviewInjectionExample && swift build --scratch-path "$scratch_path")

  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - ci-plan
      - policy
      - fast-tests
      - macro-tests
      - consumer-contracts
      - sanitizers
      - swift-62-compatibility
      - xcode-27-compatibility
      - apple-platform-builds
      - path-identity
      - examples
      - documentation-contracts
      - docc
      - remote-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evaluator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require every planned result
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 Tools/ci-policy.py evaluate

  append-perf-history:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && needs.ci-plan.outputs.post_merge == 'true'))
    needs:
      - ci-plan
      - ci-required
      - macro-tests
      - sanitizers
      - swift-62-compatibility
      - apple-platform-builds
      - path-identity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: perf-history
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download validated macro performance report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macro-performance-report
          path: build/performance
      - name: Append macro performance history
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          Tools/append-performance-history.sh \
            --report build/performance/macro-performance-report.json
