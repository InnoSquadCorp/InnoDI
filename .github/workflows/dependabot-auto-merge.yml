name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI, Dependabot Review Notice]
    types: [requested, in_progress, completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'InnoSquadCorp/InnoDI' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoDI/.github/workflows/dependabot-auto-merge.yml@refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      bot_prs: ${{ steps.targets.outputs.bot_prs }}
      manual_prs: ${{ steps.targets.outputs.manual_prs }}
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Tools
      - name: Resolve authoritative API targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Tools/dependabot-merge-policy.py targets

  manual-ready:
    needs: inspect
    if: needs.inspect.result == 'success' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoDI/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && needs.inspect.outputs.manual_prs != '[]' && needs.inspect.outputs.manual_prs != ''
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.inspect.outputs.manual_prs) }}
    concurrency:
      group: dependabot-ready-${{ matrix.pr }}
      cancel-in-progress: false
      # Keep pending PR reporters; default single-slot queues replace them.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Tools
      - name: Complete manual policy check without enabling auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          DEPENDABOT_AUTO_MERGE_ENABLED: 'false'
        run: python3 -B Tools/dependabot-merge-policy.py coordinate --pr "$PR_NUMBER"

  bot-ready:
    needs: inspect
    if: needs.inspect.result == 'success' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoDI/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.inspect.outputs.bot_prs) }}
    concurrency:
      group: dependabot-ready-${{ matrix.pr }}
      cancel-in-progress: false
      # Keep pending PR reporters; default single-slot queues replace them.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Tools
      - name: Gate native auto-merge on exact current CI proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
        run: python3 -B Tools/dependabot-merge-policy.py coordinate --pr "$PR_NUMBER"

  post-merge-plan:
    if: ${{ always() && needs.inspect.result == 'success' && github.repository == 'InnoSquadCorp/InnoDI' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoDI/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' && ((needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != '') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [inspect, manual-ready, bot-ready]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      pr: ${{ steps.plan.outputs.pr }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Tools
      - name: Plan only verified current-main bot recovery
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
          WAIT_FOR_BOT_MERGE: ${{ needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != '' }}
        run: python3 -B Tools/dependabot-merge-policy.py post-merge-plan

  post-merge:
    if: ${{ always() && needs.inspect.result == 'success' && needs.post-merge-plan.result == 'success' && needs.post-merge-plan.outputs.needed == 'true' && github.repository == 'InnoSquadCorp/InnoDI' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoDI/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' }}
    needs: [inspect, post-merge-plan]
    concurrency:
      group: dependabot-post-merge
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Tools
      - name: Reconcile actual bot merge and only its current-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
          PLANNED_MAIN: ${{ needs.post-merge-plan.outputs.main_sha }}
          PLANNED_PR: ${{ needs.post-merge-plan.outputs.pr }}
        run: python3 -B Tools/dependabot-merge-policy.py post-merge --pr "$PLANNED_PR" --expected-sha "$PLANNED_MAIN"
