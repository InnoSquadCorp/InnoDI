name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docc:
    if: >-
      github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.display_title, 'CI / Dependabot merge #'))) && github.event.workflow_run.path == '.github/workflows/macro-tests.yml' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download gated main Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: pages-artifact
      - name: Upload validated Pages artifact in this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: pages-artifact/artifact.tar
          if-no-files-found: error

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docc
    steps:
      - name: Reject stale main documentation
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_main="$(git ls-remote -- "https://github.com/$REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          if [[ "$EXPECTED_SHA" != "$remote_main" ]]; then
            echo "Refusing stale documentation for $EXPECTED_SHA; current main is $remote_main." >&2
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
