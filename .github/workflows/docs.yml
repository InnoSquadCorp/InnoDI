name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docc:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.3
        uses: ./.github/actions/select-xcode
        with:
          version: "26.3"
      - name: Validate local documentation links
        run: Tools/check-docs-local-links.sh
      - name: Generate DocC
        run: Tools/generate-docc.sh
      - name: Package DocC Artifact
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p .build/docc
          tar -C .build/docc -czf .build/docc/innodi-docc.tar.gz InnoDI
      - name: Upload DocC Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: innodi-docc
          path: .build/docc/innodi-docc.tar.gz
      - name: Upload GitHub Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .build/docc/InnoDI

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docc
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
