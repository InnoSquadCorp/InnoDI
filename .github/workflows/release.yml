name: Release Gate

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # Pin to Xcode 26.3 (Swift 6.3) so release validation and DocC
        # generation run on one known toolchain.
        run: |
          if [[ ! -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            echo "Xcode 26.3 not installed on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run Main Test Suite
        run: swift test

      - name: Run Strict Concurrency Test Suite
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: No fatalError in synthesized code
        # Keep the release gate aligned with the PR macro-tests workflow and
        # RELEASING.md. Macro-synthesized accessors must never embed runtime
        # traps into user code unless the site is explicitly inventoried and
        # allow-listed.
        run: Tools/check-no-fatalerror-in-macros.sh

      - name: Validate CI keeps build validation enabled
        run: Tools/check-ci-validation-opt-out.sh

      - name: Validate compiled documentation snippets
        run: Tools/check-docs-code-blocks.sh

      - name: Validate localized README structural sync
        # Release tags must keep localized READMEs structurally aligned with
        # the English canonical README.
        run: Tools/check-localized-readme-sync.sh

      - name: Test SwiftUI Example
        run: |
          cd Examples/SwiftUIExample
          swift build
          swift test

      - name: Test SwiftUI Example Under Strict Concurrency
        run: |
          cd Examples/SwiftUIExample
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test Preview Injection Example
        run: |
          cd Examples/PreviewInjectionExample
          swift build
          swift test

      - name: Test Preview Injection Example Under Strict Concurrency
        run: |
          cd Examples/PreviewInjectionExample
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Validate Global DAG
        run: swift run InnoDI-DependencyGraph --root . --validate-dag

      - name: Macro Performance Check
        run: Tools/measure-macro-performance.sh --enforce

      - name: Generate DocC
        run: Tools/generate-docc.sh

      - name: Package DocC Artifact
        run: |
          mkdir -p .build/docc
          tar -C .build/docc -czf .build/docc/innodi-docc.tar.gz InnoDI

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innodi-release-gate
          path: |
            .build/docc/innodi-docc.tar.gz

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: innodi-release-gate
          path: release-assets

      - name: Prepare Release Notes
        run: |
          chmod +x Tools/extract-release-notes.sh
          Tools/extract-release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.tar.gz
