name: DocC Validation

on:
  workflow_call:
    inputs:
      publish_pages:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docc:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Validate local documentation links
        run: Tools/check-docs-local-links.sh
      - name: Generate DocC
        run: Tools/generate-docc.sh
      - name: Package DocC Artifact
        run: |
          mkdir -p .build/docc
          tar -C .build/docc -czf .build/docc/innodi-docc.tar.gz InnoDI
      - name: Upload DocC Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innodi-docc
          path: .build/docc/innodi-docc.tar.gz
          if-no-files-found: error
      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_pages))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/docc/InnoDI
