name: Cold Build Benchmark

on:
  schedule:
    # Mondays at 03:00 UTC. This is the single build-cost benchmark: explicit
    # cache eviction keeps root and consumer results reproducible without a
    # second workflow whose hosted-runner cache state cannot be guaranteed.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      bindings:
        description: "Synthetic consumer @Provide bindings count"
        default: "100"
        required: false

permissions:
  contents: read

concurrency:
  group: cold-build-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-build:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - root
          - consumer
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Run cold build benchmark
        env:
          BINDINGS: ${{ github.event.inputs.bindings || '100' }}
        run: |
          set -euo pipefail
          mkdir -p .build-metrics
          if [[ "${{ matrix.scenario }}" == "consumer" ]]; then
            Tools/cold-build-benchmark.sh --target consumer --bindings "$BINDINGS" \
              | tee ".build-metrics/cold-${{ matrix.scenario }}.json"
          else
            Tools/cold-build-benchmark.sh --target root \
              | tee ".build-metrics/cold-${{ matrix.scenario }}.json"
          fi
      - name: Upload cold build metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-build-${{ matrix.scenario }}
          path: .build-metrics/
          retention-days: 14
