name: Cold Build Benchmark

on:
  schedule:
    # Mondays at 03:00 UTC. This is the single build-cost benchmark: explicit
    # cache eviction keeps root and consumer results reproducible without a
    # second workflow whose hosted-runner cache state cannot be guaranteed.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      bindings:
        description: "Synthetic consumer @Provide bindings count"
        default: "100"
        required: false

permissions:
  contents: read

concurrency:
  group: cold-build-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-build:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: root-xcode-26.6
            target: root
            xcode: "26.6"
            expected_swift_syntax_mode: ""
          - scenario: consumer-xcode-26.5
            target: consumer
            xcode: "26.5"
            # Compatibility observation: Swift 6.3.2 has no matching 603.0.2
            # prebuilt and therefore compiles SwiftSyntax from source.
            expected_swift_syntax_mode: ""
          - scenario: consumer-xcode-26.6
            target: consumer
            xcode: "26.6"
            # This is the build-economy contract for the primary consumer
            # toolchain. Regressing to a source build must fail visibly.
            expected_swift_syntax_mode: prebuilt
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select Xcode ${{ matrix.xcode }}
        uses: ./.github/actions/select-xcode
        with:
          version: ${{ matrix.xcode }}
      - name: Run cold build benchmark
        env:
          BINDINGS: ${{ github.event.inputs.bindings || '100' }}
        run: |
          set -euo pipefail
          mkdir -p build/benchmarks
          Tools/cold-build-benchmark.sh \
            --target "${{ matrix.target }}" \
            --bindings "$BINDINGS" \
            --build-log "build/benchmarks/cold-${{ matrix.scenario }}.log" \
            | tee "build/benchmarks/cold-${{ matrix.scenario }}.json"
      - name: Verify expected SwiftSyntax mode
        if: matrix.expected_swift_syntax_mode != ''
        env:
          EXPECTED_SWIFT_SYNTAX_MODE: ${{ matrix.expected_swift_syntax_mode }}
          METRICS_PATH: build/benchmarks/cold-${{ matrix.scenario }}.json
        run: |
          set -euo pipefail
          actual="$(jq -r '.swift_syntax_mode' "$METRICS_PATH")"
          if [[ "$actual" != "$EXPECTED_SWIFT_SYNTAX_MODE" ]]; then
            echo "Expected SwiftSyntax mode '$EXPECTED_SWIFT_SYNTAX_MODE', found '$actual'." >&2
            exit 1
          fi
      - name: Upload cold build metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-build-${{ matrix.scenario }}
          path: build/benchmarks/
          if-no-files-found: error
          retention-days: 14
