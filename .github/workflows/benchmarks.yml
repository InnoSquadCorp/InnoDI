name: Benchmarks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  benchmark-compare:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # Pin to Xcode 26.3 (Swift 6.3). Benchmark baselines assume Swift 6.3;
        # an earlier Xcode would silently skew runtime numbers without failing.
        run: |
          if [[ ! -d /Applications/Xcode_26.3.app/Contents/Developer ]]; then
            echo "Xcode 26.3 not installed on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run Framework Comparison Benchmarks
        run: Benchmarks/compare.sh --preset local --compile-iterations 5 --runtime-runs 5 --runtime-iterations 100000

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innodi-benchmarks
          path: |
            Benchmarks/results/*.json
            Benchmarks/results/*.md
