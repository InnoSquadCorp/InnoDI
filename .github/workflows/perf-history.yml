name: Perf History

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  append-perf-history:
    # Manual recovery path for rebuilding an entry. Normal main pushes reuse
    # the gated report in macro-tests.yml and append it from an Ubuntu job.
    runs-on: macos-26
    permissions:
      contents: write
    concurrency:
      group: perf-history
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch full history so `git rev-parse --short=12` and
          # `git show -s --format=%cI` resolve the commit metadata the
          # append script writes into each entry.
          fetch-depth: 0
          # `permissions: contents: write` above provides the token; this
          # checkout also persists credentials so the append script can
          # `git push origin perf-history`.
          persist-credentials: true
      - name: Select Xcode 26.6
        uses: ./.github/actions/select-xcode
        with:
          version: "26.6"
      - name: Append macro-perf entry
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: Tools/append-performance-history.sh
