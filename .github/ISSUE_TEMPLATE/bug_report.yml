name: Bug report
description: Something is wrong with InnoDI's macros, validation, runtime, or examples.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough context for us to
        reproduce the failure without back-and-forth. If the issue is a build
        plugin lock or cache problem, prefer the Graph & DAG Validation
        template instead.

  - type: input
    id: innodi-version
    attributes:
      label: InnoDI version
      description: Tag, branch, or commit SHA you are using.
      placeholder: "4.1.0"
    validations:
      required: true

  - type: input
    id: swift-version
    attributes:
      label: Swift toolchain
      description: Output of `swift --version` (one line is enough).
      placeholder: "Apple Swift version 6.3 (swiftlang-6.3.0...) Target: arm64-apple-macosx14.0"
    validations:
      required: true

  - type: input
    id: xcode-version
    attributes:
      label: Xcode version (if applicable)
      placeholder: "Xcode 26.3 (Build 16E140)"

  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      multiple: true
      options:
        - macOS
        - iOS / iPadOS
        - watchOS
        - tvOS
        - visionOS
        - SwiftPM CLI (`swift build`/`swift test`)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Smallest possible `@DIContainer` (or `@SubContainer`, `@Provide`, etc.)
        that triggers the issue. Include factory closures with parameter types.
        Wrap in a Swift code block.
      render: swift
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: |
        Compiler diagnostics, runtime errors, or generated-code differences.
        For macro diagnostics, include the full diagnostic text and the line
        in your source it points to.
    validations:
      required: true

  - type: textarea
    id: investigation
    attributes:
      label: What you already tried
      description: Optional. Workarounds, recent changes, or related issues.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I reproduced the bug on the latest tagged release (or `main`).
          required: true
