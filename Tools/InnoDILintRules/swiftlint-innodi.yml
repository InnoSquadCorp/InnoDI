# InnoDI custom SwiftLint rules.
#
# Usage: copy these definitions into your repository's `.swiftlint.yml`
# under `custom_rules:`, or include this file directly with
#   included:
#     - Tools/InnoDILintRules/swiftlint-innodi.yml
# (when your SwiftLint version supports `included` configs).
#
# These rules enforce InnoDI invariants the macro plugin cannot diagnose
# from a single declaration site. They complement the macro diagnostics
# rather than replace them.

custom_rules:
  innodi_validate_dag_in_production:
    name: "InnoDI validateDAG opt-out"
    regex: '@DIContainer\b(?:(?!@DIContainer\b|(?:^|\n)\s*(?:@\w+(?:\([^)]*\))?\s*)*(?:(?:public|internal|private|fileprivate|open|package|final|nonisolated)\s+)*(?:struct|class|actor|enum)\b)[\s\S])*?validateDAG\s*:\s*false'
    match_kinds:
      - attribute.builtin
      - argument
      - identifier
      - keyword
      - typeidentifier
    message: |
      `@DIContainer(validateDAG: false)` opts the container out of the
      global DAG and local cycle gates. Production code paths must keep
      the default. See InnoDI.docc/DAGValidation.md for the
      configuration-aware enforcement pattern.
    severity: error

  innodi_no_lazy_typealias:
    name: "InnoDI Lazy/Provider typealias"
    regex: 'typealias\s+\w+\s*=\s*(?:InnoDI\.)?(?:Lazy|Provider)\b'
    match_kinds:
      - identifier
      - keyword
      - typeidentifier
    message: |
      Avoid `typealias Foo = InnoDI.Lazy<...>` (or `Provider<...>`).
      The macro recognizes the deferred wrappers by canonical
      identifier; cross-file aliases silently behave as hard edges and
      disable cycle escape. Spell `Lazy<T>` or `InnoDI.Lazy<T>` at every
      factory parameter site.
    severity: warning

  innodi_disable_validation_in_workflow:
    name: "INNODI_DISABLE_BUILD_VALIDATION in CI"
    regex: 'INNODI_DISABLE_BUILD_VALIDATION:\s*[''"]?(?:1|true|TRUE|yes|YES)'
    included:
      - .github/workflows/.*\.ya?ml
      - .gitlab-ci\.yml
      - .circleci/.*
    message: |
      The DAG validation build plugin is the gate that emits the
      validation metrics artifact. CI workflows must not set
      INNODI_DISABLE_BUILD_VALIDATION=1; opt out only in local
      iteration loops. See InnoDI.docc/PluginOptOut.md.
    severity: error
